# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37

kotlin.code.style=official

# 在低内存环境下禁用 Kotlin 守护进程，让 Kotlin 编译在 Gradle daemon JVM 内执行
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
