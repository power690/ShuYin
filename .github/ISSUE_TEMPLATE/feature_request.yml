name: "💡 功能建议 | Feature Request"
description: "为鼠音 ShuYin 提出新功能或改进建议，得票最高的建议将优先开发 | Propose a feature or improvement — top-voted suggestions get development priority"
title: "[功能建议 | Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🗳️ 投票规则 | Voting Rules

        - 想支持这条建议，请给本 Issue 点 **👍** 表情，每人一票 | To support this suggestion, add a **👍** reaction to this issue — one vote per person
        - 请勿回复 "+1" 类评论，直接点 **👍** 即可 | Please avoid "+1" comments — the **👍** reaction is the vote
        - **每个版本开发前，得票最高的建议将优先纳入开发计划** | **Before each release, top-voted suggestions will be prioritized**
        - 提交前请先搜索已有 Issue，避免重复建议 | Please search existing issues before submitting to avoid duplicates
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 | Pre-submit Checklist
      options:
        - label: 我已搜索过现有 Issue，确认没有重复的建议 | I have searched existing issues and confirmed this is not a duplicate
          required: true
  - type: dropdown
    id: category
    attributes:
      label: 建议类别 | Category
      description: 这条建议属于哪个方面？ | Which area does this suggestion belong to?
      options:
        - "🎵 播放功能 | Playback"
        - "🎨 界面与主题 | UI & Theme"
        - "📝 歌词 | Lyrics"
        - "📂 扫描与文件管理 | Scanning & Files"
        - "🌍 语言与翻译 | Language & Translation"
        - "⚙️ 设置与其他 | Settings & Others"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 建议描述 | Suggestion
      description: 清晰描述你想要的功能，它应该怎么工作？| Describe the feature you want and how it should work
      placeholder: "例：希望收藏支持自定义分组，可以按场景建歌单…… | e.g. I'd like favorites to support custom groups..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题 | Problem Solved
      description: 这个功能解决了什么痛点？什么场景下需要？| What pain point does this solve? In what scenario do you need it?
      placeholder: "例：歌曲越来越多，没有分组很难快速找到想听的…… | e.g. With hundreds of songs, it is hard to find what I want..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 | Alternatives
      description: 你考虑过哪些替代做法？为什么觉得不够好？| Any alternatives you have considered? Why are they not good enough?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息 | Additional Context
      description: 截图、参考的其他 App、或任何补充说明 | Screenshots, reference apps, or anything else
    validations:
      required: false
