name: "🐛 问题反馈 | Bug Report"
description: "报告使用鼠音 ShuYin 时遇到的问题 | Report a problem you encountered while using ShuYin"
title: "[问题 | Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > 感谢反馈！提交前请先搜索已有 Issue，确认没有重复的报告 | Thanks for reporting! Please search existing issues first to avoid duplicates
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 | Pre-submit Checklist
      options:
        - label: 我已搜索过现有 Issue，确认没有重复的问题报告 | I have searched existing issues and confirmed this is not a duplicate
          required: true
        - label: 我使用的是最新发布版本 | I am using the latest release version
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述 | What Happened
      description: 发生了什么？原本期望发生什么？| What happened, and what did you expect instead?
      placeholder: "例：播放 FLAC 歌曲约 30 秒后声音突然停止…… | e.g. Playback stops after about 30 seconds on FLAC tracks..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 | Steps to Reproduce
      description: 请按步骤描述如何复现这个问题 | List the steps to reproduce the behavior
      placeholder: "1. 打开 App 2. 进入…… | 1. Open the app 2. Go to..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 软件版本 | App Version
      description: 设置 → 关于 页面可查看版本号 | Found in Settings → About
      placeholder: "1.9.1"
    validations:
      required: true
  - type: dropdown
    id: android
    attributes:
      label: Android 版本 | Android Version
      options:
        - "Android 15+"
        - "Android 14"
        - "Android 13"
        - "Android 12"
        - "Android 11"
        - "Android 10"
        - "Android 9 及以下 | Android 9 or below"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号 | Device Model
      placeholder: "例：小米 14 | e.g. Xiaomi 14"
  - type: textarea
    id: logs
    attributes:
      label: 截图或日志 | Screenshots or Logs
      description: 如有截图或错误日志请附上，有助于快速定位问题 | Attach screenshots or logs if available — it helps us fix the issue faster
