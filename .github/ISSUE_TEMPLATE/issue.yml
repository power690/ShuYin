name: "💡 功能建议 / 🐛 问题反馈"
description: "提交功能建议或问题反馈，建议可通过 👍 投票"
title: "[建议/问题] "
body:
  - type: markdown
    attributes:
      value: |
        ## 🗳️ 投票规则（功能建议）

        想支持这条建议，请给本 Issue 点 👍 表情，每人一票
        请勿回复 "+1" 类评论，直接点 👍 即可
        每个版本开发前，得票最高的建议将优先纳入开发计划
        提交前请先搜索已有 Issue，避免重复
  - type: dropdown
    id: type
    attributes:
      label: 类型
      options:
        - "💡 功能建议"
        - "🐛 问题反馈"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认没有重复
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及方面
      options:
        - "🎵 播放功能"
        - "🎨 界面与主题"
        - "📝 歌词"
        - "📂 扫描与文件管理"
        - "🌍 语言与翻译"
        - "⚙️ 设置与其他"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 描述
      description: |
        功能建议：清晰描述你想要的功能，它应该怎么工作
        问题反馈：发生了什么？原本期望发生什么？
      placeholder: |
        例：希望收藏支持自定义分组，可以按场景建歌单
        例：播放 FLAC 歌曲约 30 秒后声音突然停止
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤（问题反馈必填）
      description: |
        按步骤描述如何复现这个问题（功能建议可留空）
      placeholder: |
        1. 打开 App
        2. 进入……
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 设置 → 关于 页面可查看版本号
      placeholder: "1.9.1"
    validations:
      required: true
  - type: dropdown
    id: android
    attributes:
      label: Android 版本
      options:
        - "Android 15+"
        - "Android 14"
        - "Android 13"
        - "Android 12"
        - "Android 11"
        - "Android 10"
        - "Android 9 及以下"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: "例：小米 14"
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: |
        截图、参考的其他 App、错误日志或任何补充说明
